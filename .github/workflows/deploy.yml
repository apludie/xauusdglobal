# Publishes the website to GitHub Pages and refreshes gold-market headlines.
# Runs on every push to main, every hour, and on demand (Actions tab → Run workflow).
# Requires: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy site and update news

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"   # every hour at :17 (UTC); GitHub may delay scheduled runs
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch latest headlines from RSS feeds
        run: python3 _build/fetch_news.py
        continue-on-error: true   # the site still deploys if a feed is down

      - name: Assemble site files
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_build' \
                   --exclude '_site' --exclude '*.md' --exclude '_config.yml' ./ _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
