# "Think it through" questions shown at the end of each article.
# Keyed by article slug. Five questions: context, thesis, evidence/invalidation, risk, lesson.
fair-value-gap-xauusd:
  - "Which direction is the higher-timeframe structure pointing — and does this gap agree with it?"
  - "Was the gap created by a real displacement move, or just a quiet drift?"
  - "If price fills the gap completely and keeps going, where exactly is your idea wrong?"
  - "Is there a news release before price is likely to reach the gap?"
  - "After the trade: did the gap hold because of the gap, or because of something else on the chart?"
gold-breakout-retest-strategy:
  - "Was the level you are watching obvious to most traders — and what liquidity sits beyond it?"
  - "Did the breakout close beyond the level with conviction, or only wick through it?"
  - "On the retest, what price action would tell you the breakout has failed?"
  - "If the retest is deeper than expected, does your stop still make sense for your position size?"
  - "Review: was this a real breakout or a sweep? What would have told you earlier?"
ict-trading-xauusd:
  - "Which session and time window are you in, and does it matter for this idea?"
  - "Which liquidity has already been taken, and which is still resting?"
  - "Can you explain the setup without using any ICT terms? If not, what are you really seeing?"
  - "Where is the idea invalid, and is the risk to that level acceptable?"
  - "Afterwards: which part of the model actually helped your decision, and which part was noise?"
liquidity-sweep-xauusd:
  - "Where are the obvious highs or lows that other traders are likely protecting?"
  - "After the sweep, did price show a clear reaction — or did it just keep trending?"
  - "How would you tell a sweep from a genuine breakout in real time?"
  - "Where does your stop go if the sweep turns into a continuation?"
  - "Review: did you enter on confirmation, or on hope that it was a sweep?"
london-session-gold-trading:
  - "What did the Asian session range look like, and where are its highs and lows?"
  - "Is there UK or European data during the London morning?"
  - "If the first London move is a fake-out, what would confirm it?"
  - "Are the spread and volatility at the open acceptable for your stop size?"
  - "Review: did you trade the session plan, or react to the first big candle?"
market-structure-xauusd:
  - "Which timeframe defines the trend you are trading, and does the lower timeframe agree?"
  - "Is the latest break of structure a real close beyond the swing, or just a wick?"
  - "Which swing point, if broken, would change your view of the trend?"
  - "Is your stop placed beyond structure, or at an arbitrary number of pips?"
  - "Review: did you label structure before the move, or after it was obvious?"
new-york-session-gold-trading:
  - "Which US data is due today, and at what time?"
  - "Has London already set the day's high or low?"
  - "If the data surprises against your idea, what happens to your position?"
  - "Will you be in a trade during the release, and is that a decision you made on purpose?"
  - "Review: did the move come from the data, the London–New York overlap, or something else?"
order-blocks-xauusd:
  - "Did this order block lead to a real break of structure?"
  - "Is it fresh, or has price already returned to it?"
  - "How much of the zone can price trade through before the idea is wrong?"
  - "Is the zone too wide for a sensible stop and position size?"
  - "Review: would this block still look valid if you had marked it before the move?"
smart-money-concepts-xauusd:
  - "What is the higher-timeframe bias, and why?"
  - "Which SMC element is doing the real work here — structure, liquidity or the point of interest?"
  - "What would a trader using plain support and resistance see on the same chart?"
  - "Where does the idea fail, and how much are you risking to find out?"
  - "Review: did you need every confirmation you waited for, or did you add complexity?"
support-and-resistance-xauusd:
  - "Is this level visible on a higher timeframe, or only on the chart you're watching?"
  - "How many times has it been tested, and did each test weaken it?"
  - "What close would tell you the level has broken?"
  - "Is your stop beyond the zone, not just beyond the line?"
  - "Review: did you treat the level as a zone or as an exact price?"
xauusd-risk-management:
  - "What percentage of your account is at risk on this trade?"
  - "Is your stop placed where the idea is wrong — or where the loss feels comfortable?"
  - "How does today's volatility compare to normal, and should your size change?"
  - "What is your maximum daily or weekly loss before you stop trading?"
  - "Review: did you follow your risk rules on every trade this week?"
common-mistakes-intermediate-gold-traders:
  - "Which of these mistakes have you made in the last month?"
  - "What usually happens just before you make it — the time, the emotion, the market?"
  - "What rule would make that mistake harder to repeat?"
  - "How much has that mistake cost you, in percentage terms?"
  - "How will you check next week whether the rule worked?"
how-to-build-a-xauusd-trading-plan:
  - "Which conditions does your plan trade, and which does it avoid?"
  - "Can someone else read your entry rules and apply them the same way?"
  - "What makes a trade invalid before entry, and after?"
  - "What are your risk-per-trade and daily-loss limits?"
  - "When will you review the plan, and what would make you change it?"
how-to-identify-support-and-resistance-gold:
  - "Did you mark levels on the higher timeframe first?"
  - "Which levels have clear reactions, and which are just noise you want to see?"
  - "How would you know a level is no longer respected?"
  - "Does trading from this level give a sensible risk-to-reward?"
  - "Review: which levels mattered this week, and why?"
how-to-keep-a-trading-journal:
  - "Are you recording the reason for each trade before you know the result?"
  - "Do you write down your invalidation and risk, not just entry and exit?"
  - "Which mistakes appear more than once in your journal?"
  - "Are you journaling losses as carefully as wins?"
  - "When is your weekly review, and what one change will come out of it?"
ict-concepts-for-gold-trading:
  - "Which single ICT idea are you actually using in this trade?"
  - "Does the higher-timeframe context support it?"
  - "What would prove the idea wrong?"
  - "Is the risk to that point acceptable for your account?"
  - "Review: did the concept help, or did you fit the chart to the concept?"
london-vs-new-york-sessions:
  - "Which session suits your schedule and your strategy?"
  - "What usually happens in that session on days with major US data?"
  - "How do you avoid chasing a move the earlier session already made?"
  - "Do you change your size or stop width between sessions?"
  - "Review: in which session do you trade best — and does your journal agree?"
risk-management-volatile-gold-markets:
  - "How does today's range compare with the average?"
  - "If volatility is higher, have you reduced size to keep risk the same?"
  - "What would make you stand aside completely today?"
  - "Could a news spike or weekend gap move price beyond your stop?"
  - "Review: did volatility change your behaviour — or only your results?"
smart-money-concepts-explained-xauusd:
  - "Can you explain, in one sentence, why price should move your way?"
  - "Which liquidity is the idea targeting, and which is it ignoring?"
  - "What would the opposite argument on the same chart look like?"
  - "Where is the idea wrong, and how much would that cost?"
  - "Review: which SMC concepts earn their place in your process?"
what-is-xauusd:
  - "Do you know the value of a one-point move for your position size?"
  - "Which events this week are most likely to move gold?"
  - "What would make you skip trading gold today?"
  - "Have you tested your approach on a demo before using real money?"
  - "Review: what surprised you most about how gold moved this week?"
what-moves-gold-prices:
  - "What are the US dollar and Treasury yields doing today?"
  - "Which scheduled data or central-bank events could change the picture?"
  - "Does your technical idea agree or disagree with the macro backdrop?"
  - "If an unexpected headline hits, how is your risk protected?"
  - "Review: which driver explained this week's move best — and did you see it in advance?"
